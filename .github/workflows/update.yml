name: Update feed
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_feed.py
      - run: |
          git config user.name "boost-bot"
          git config user.email "boost-bot@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || (git commit -m "Update feed" && git push)
